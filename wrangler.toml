name = "agent-whiteboard-api"
main = "src/index.js"
compatibility_date = "2026-11-14"
account_id = "347bd7c849ef5c465e49cd014752d0cc"
workers_dev = true
preview_urls = false

[build]
command = "node scripts/build-agent-guide.mjs"

[triggers]
crons = ["17 * * * *"]

# 遷移窗口已關閉：所有讀取都要個人／Agent 令牌（管理台會額外加
# X-Whiteboard-Require-Auth，本來就沒開放過）。臨時要恢復公開讀取再設回 "true"。
[vars]
BOARD_ORIGIN = "https://board.a4a4.ccwu.cc"
ALLOW_PUBLIC_READ = "false"

# 舊共用 API_KEY 已於 2026-11-19 從 Worker secret 刪除；即使重新設定，預設也只是只讀。
# 真的需要暫時恢復舊頁面寫入時，才加一行：
# ALLOW_LEGACY_WRITE = "true"

# 用 workers.dev 免費域名先跑起來，不用你自己的域名。
# 部署後地址會是 https://agent-whiteboard-api.<你的子域名>.workers.dev
# 想換自訂域名時再加 routes。

[[d1_databases]]
binding = "DB"
database_name = "agent-whiteboard"
database_id = "7d01837a-0212-42f8-9598-93e3e0f773bb"

[[r2_buckets]]
binding = "FILES"
bucket_name = "agent-whiteboard-files"

# Token 不要寫在這裡。部署後執行：
#   wrangler secret put API_KEY
# 然後把同一個 Token 發給要接入的 Agent。
# 沒設 API_KEY 時寫入不檢查（原型方便測試），正式用務必設定。
